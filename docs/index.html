<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期权虚值权利金指标</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body { background: #f5f5f5; }
.table-wrap { overflow: auto; max-height: 70vh; background: #fff; border-radius: 8px; }
table { white-space: nowrap; font-size: 0.9rem; }
thead th {
  background: #e9ecef; position: sticky; top: 0; cursor: pointer;
  z-index: 3; box-shadow: 0 1px 0 #dee2e6;
}
thead th:hover { background: #dee2e6; }
tbody th { position: sticky; left: 0; background: #f8f9fa; z-index: 2; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.status-ok { color: #198754; font-weight: 600; }
.status-err { color: #dc3545; }
</style>
</head>
<body class="py-4">
<div class="container-fluid px-4">
  <h4 class="mb-1">期权虚值前两档权利金指标</h4>
  <p class="text-muted small mb-3">
    生成时间: <span id="genAt">加载中...</span>
    <span id="runDate" class="ms-3"></span>
  </p>

  <div class="d-flex gap-2 align-items-center mb-3 flex-wrap">
    <input id="search" class="form-control form-control-sm" style="max-width:280px"
           placeholder="搜索品种/交易所/月份...">
    <button id="updateBtn" class="btn btn-primary btn-sm">更新数据</button>
    <button id="exportTpl" class="btn btn-outline-secondary btn-sm" title="导出当前全部品种代码为排序模板 txt">导出模板</button>
    <button id="importTpl" class="btn btn-outline-secondary btn-sm" title="导入排序模板 txt, 按模板顺序排列品种">导入模板</button>
    <button id="exportXlsx" class="btn btn-success btn-sm" title="按参考模板格式导出日金表 xlsx(品种按当前排序)">导出Excel</button>
    <label class="small text-muted ms-2 mb-0">排序:</label>
    <select id="sortMode" class="form-select form-select-sm" style="width:auto">
      <option value="builtin">默认顺序</option>
      <option value="custom">我的导入模板</option>
      <option value="none">原始顺序</option>
    </select>
    <input type="file" id="tplFile" accept=".txt,text/plain" style="display:none">
    <span id="updateStatus" class="small text-muted"></span>
    <span id="tplStatus" class="small text-muted ms-2"></span>
  </div>

  <div class="table-wrap">
    <table class="table table-sm table-hover mb-0">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <p class="text-muted small mt-3">
    公式: Result = (C虚1+C虚2+P虚1+P虚2) / [2×(到期天数)]　·
    到期天数 = TqSdk剩余天数 + 1　·
    IV 由 Black-Scholes 反解, 无风险利率 1.15%
  </p>
</div>

<script>
const NUM_COLS = ['标的价格','C虚1价格','C虚2价格','P虚1价格','P虚2价格',
  'C虚1IV','C虚2IV','P虚1IV','P虚2IV','到期天数','四张合约合计','最终结果','平均IV'];
let DATA = [], COLS = [], sortCol = null, sortAsc = true, RUN_DATE = '';

// 数值列动态识别: 含"价格/IV/天数/合计/÷/结果"的列
function isNumCol(c){ return NUM_COLS.includes(c); }

function fmt(v, col){
  if(v === null || v === undefined || v === '') return '-';
  if(isNumCol(col)){
    const n = Number(v);
    if(!isNaN(n)) return n.toFixed(2);
  }
  return String(v);
}

function renderHead(){
  const tr = document.createElement('tr');
  COLS.forEach(c => {
    const th = document.createElement('th');
    th.textContent = c;
    th.dataset.col = c;
    if(isNumCol(c)) th.classList.add('num');
    th.onclick = () => { if(sortCol===c){sortAsc=!sortAsc;} else {sortCol=c; sortAsc=true;} render(); };
    tr.appendChild(th);
  });
  document.getElementById('thead').innerHTML = '';
  document.getElementById('thead').appendChild(tr);
}

function renderBody(){
  const tb = document.getElementById('tbody');
  tb.innerHTML = '';
  const kw = document.getElementById('search').value.trim().toLowerCase();
  let rows = DATA.slice();
  if(kw){
    rows = rows.filter(r => COLS.some(c => String(r[c]??'').toLowerCase().includes(kw)));
  }
  if(sortCol){
    const nc = sortCol;
    rows.sort((a,b) => {
      let x = a[nc], y = b[nc];
      if(isNumCol(nc)){ x = Number(x)||0; y = Number(y)||0; }
      else { x = String(x??''); y = String(y??''); }
      if(x<y) return sortAsc?-1:1;
      if(x>y) return sortAsc?1:-1;
      return 0;
    });
  }
  rows.forEach(r => {
    const tr = document.createElement('tr');
    COLS.forEach(c => {
      const td = document.createElement('td');
      td.textContent = fmt(r[c], c);
      if(isNumCol(c)) td.classList.add('num');
      if(c === '状态'){
        const s = String(r[c]||'');
        td.classList.add(s==='OK'?'status-ok':'status-err');
      }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
}

function render(){
  renderHead();
  renderBody();
}

function loadData(){
  // 加 cache-buster 绕过 CDN 缓存, 保证拿到最新结果
  return fetch('results.json?cb=' + Date.now())
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(j => {
      COLS = j.columns || [];
      DATA = j.data || [];
      RUN_DATE = j.run_date || '';
      document.getElementById('genAt').textContent = j.generated_at || '-';
      document.getElementById('runDate').textContent = j.run_date ? ('数据日期: '+j.run_date) : '';
      applyTemplate();
      render();
    });
}

loadData().catch(e => {
  document.getElementById('genAt').textContent = '加载失败: ' + e.message;
});

document.getElementById('search').addEventListener('input', renderBody);

// ===== 排序模板: 内置默认顺序 / 导入自定义 txt / 原始顺序 =====
// 数据仍按默认顺序获取, 加载后在前端按所选顺序重排, 不影响数据本身
// 内置默认顺序(自选清单), 打开网页即生效, 无需每次导入
const DEFAULT_TEMPLATE = ['SC','AG','AU','CU','SN','NI','BR','JM','P','PS','LC','MO','IO','HO',
  'A','AD','AL','AO','AP','B','BC','BU','BZ','C','CF','CJ','CS','EB','EG','FG','FU','I','JD',
  'L','LG','LH','M','MA','NR','OI','OP','PB','PD','PF','PG','PK','PL','PP','PR','PT','PX',
  'RB','RM','RU','SA','SF','SH','SI','SM','SP','SR','TA','UR','V','Y','ZC','ZN','J'];
function rowCode(r){ return String(r['品种']||'').split(/[：:]/)[0].trim().toUpperCase(); }
function getTpl(){ try{ return JSON.parse(localStorage.getItem('sort_template')||'[]'); }catch(e){ return []; } }
function getMode(){ return localStorage.getItem('sort_mode') || 'builtin'; }  // builtin | custom | none
// 当前生效的排序列表
function getActiveTpl(){
  const m = getMode();
  if(m === 'none') return [];
  if(m === 'custom'){ const t = getTpl(); return t.length ? t : DEFAULT_TEMPLATE; }
  return DEFAULT_TEMPLATE;
}
function setTplStatus(){
  const m = getMode();
  const el = document.getElementById('tplStatus');
  let txt;
  if(m === 'custom'){
    const n = getTpl().length;
    txt = n ? ('我的导入模板 (' + n + ' 个品种), 其余排最后') : '导入模板为空, 已用默认顺序';
  }else if(m === 'none'){
    txt = '原始顺序';
  }else{
    txt = '默认顺序 (' + DEFAULT_TEMPLATE.length + ' 个品种), 其余排最后';
  }
  el.textContent = txt;
  el.className = 'small ms-2 ' + (m === 'none' ? 'text-muted' : 'text-success');
}
function applyTemplate(){
  const tpl = getActiveTpl();
  if(!tpl.length){ setTplStatus(); return; }
  const idx = {}; tpl.forEach((c,i) => idx[c.toUpperCase()] = i);
  DATA.forEach((r,i) => r.__pos = i);
  DATA.sort((a,b) => {
    const ia = idx[rowCode(a)], ib = idx[rowCode(b)];
    const ka = ia === undefined ? 1 : 0, kb = ib === undefined ? 1 : 0;
    if(ka !== kb) return ka - kb;        // 模板内品种在前
    if(ka === 0) return ia - ib;         // 模板内按模板顺序
    return a.__pos - b.__pos;            // 模板外保持默认顺序
  });
  DATA.forEach(r => delete r.__pos);
  setTplStatus();
}
// 解析模板 txt: # 开头为注释; 代码可每行一个, 也可用空格/逗号/顿号/分号分隔; 可有引号
function parseTpl(text){
  const codes = [];
  String(text||'').split(/\r?\n/).forEach(line => {
    line = line.trim();
    if(!line || line.startsWith('#')) return;
    line.split(/[\s,;，、]+/).forEach(tok => {
      const c = tok.replace(/["'“”‘’]/g, '').trim().toUpperCase();
      if(/^[A-Z]{1,4}$/.test(c) && !codes.includes(c)) codes.push(c);
    });
  });
  return codes;
}
document.getElementById('exportTpl').addEventListener('click', () => {
  const codes = [...new Set(DATA.map(rowCode).filter(Boolean))];
  const lines = [
    '# 期权品种排序模板',
    '# 每行一个品种代码(如 AG), 表格将按本文件中的顺序排列; 不在模板中的品种排在最后',
    '# 以 # 开头的行为注释, 可删除; 代码不区分大小写; 也可用空格/逗号/顿号分隔',
    ''
  ].concat(codes);
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/plain;charset=utf-8'});  // ﻿ 为 UTF-8 BOM, 保证记事本中文不乱码
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '期权排序模板.txt';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
});
document.getElementById('importTpl').addEventListener('click', () => document.getElementById('tplFile').click());
document.getElementById('tplFile').addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const tpl = parseTpl(reader.result);
    if(!tpl.length){ alert('模板中未识别到品种代码, 请先点"导出模板"查看格式'); return; }
    localStorage.setItem('sort_template', JSON.stringify(tpl));
    localStorage.setItem('sort_mode', 'custom');   // 导入后自动切到"我的导入模板"
    document.getElementById('sortMode').value = 'custom';
    sortCol = null;   // 取消列排序, 展示模板顺序
    applyTemplate();
    render();
  };
  reader.readAsText(f, 'utf-8');
});
// 排序方式下拉切换
document.getElementById('sortMode').addEventListener('change', e => {
  localStorage.setItem('sort_mode', e.target.value);
  sortCol = null;
  applyTemplate();
  render();
});
// 初始化下拉框为当前模式
document.getElementById('sortMode').value = getMode();

// ===== 导出 Excel: 按参考模板(日金表)格式, 每个品种占 天/C+P前T/日金/隐波 四列 =====
// 品种及顺序: 跟随当前排序方式(默认顺序/我的导入模板); 原始顺序时导出全部品种
function numOrBlank(v){
  const n = Number(v);
  return (v === null || v === undefined || v === '' || isNaN(n)) ? '' : n;
}
document.getElementById('exportXlsx').addEventListener('click', () => {
  if(typeof XLSX === 'undefined'){ alert('Excel 组件未加载(可能 CDN 被拦截), 请检查网络后刷新重试'); return; }
  if(!DATA.length){ alert('暂无数据可导出'); return; }
  const byCode = {};
  DATA.forEach(r => { const c = rowCode(r); if(c) byCode[c] = r; });
  let codes = getActiveTpl();                    // 当前生效排序(默认顺序/导入模板)
  if(!codes.length) codes = DATA.map(rowCode).filter(Boolean);  // 原始顺序 -> 全部品种
  // 品种中文名(参考模板第1行表头用中文名)
  const nameOf = code => {
    const r = byCode[code];
    if(!r) return code;
    const p = String(r['品种']||'').split(/[：:]/);
    return (p[1] && p[1].trim()) || code;
  };
  // 日期: run_date(2026-09-03) -> 模板样式 M.D(9.3)
  let dateCell = RUN_DATE || '';
  const dm = String(RUN_DATE).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(dm) dateCell = Number(dm[2]) + '.' + Number(dm[3]);

  const row1 = ['日金'], row2 = ['日期'], row3 = [dateCell];
  const merges = [];
  codes.forEach((code, i) => {
    const c0 = 1 + i * 4;                      // 0 基列号, A=0
    merges.push({ s: { r: 0, c: c0 }, e: { r: 0, c: c0 + 3 } });  // 第1行品种名合并4列
    row1.push(nameOf(code), '', '', '');
    row2.push('天', 'C+P前T', '日金', '隐波');
    const r = byCode[code];
    if(r){
      row3.push(numOrBlank(r['到期天数']), numOrBlank(r['四张合约合计']),
               numOrBlank(r['最终结果']), numOrBlank(r['平均IV']));
    }else{
      row3.push('', '', '', '');
    }
  });
  const ws = XLSX.utils.aoa_to_sheet([row1, row2, row3]);
  ws['!merges'] = merges;
  ws['!cols'] = [{ wch: 10 }].concat(
    codes.flatMap(() => [{ wch: 6 }, { wch: 12 }, { wch: 9 }, { wch: 8 }])
  );
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '日金');
  XLSX.writeFile(wb, '期权日金_' + (RUN_DATE || ('run' + Date.now())) + '.xlsx');
});

// ===== 更新数据: 触发 GitHub Actions; 运行状态由仓库内 update_status.json 同步给所有访问者 =====
const REPO = 'ylw0329/option-premium';
const WF_FILE = 'run.yml';
const API = 'https://api.github.com/repos/' + REPO;
const btn = document.getElementById('updateBtn');
const statusEl = document.getElementById('updateStatus');
const STALE_MS = 30 * 60 * 1000;   // running 超过 30 分钟视为僵尸(CI 异常中断), 恢复按钮
let isRunning = false;             // 当前是否处于更新中(对所有人生效)
let sawRunning = false;            // 本轮轮询是否见过 running(用于 running->idle 时自动刷新)

function getToken(){ return localStorage.getItem('gh_pat') || ''; }

function askToken(){
  const t = prompt(
    '首次使用需要 GitHub Token 用于触发更新(仅存于你自己的浏览器)。\n\n' +
    '创建方法: GitHub → Settings → Developer settings →\n' +
    'Fine-grained tokens → Generate new token →\n' +
    '仅选择仓库 option-premium, 权限勾选 Actions: Read and write。');
  if(t && t.trim()){
    localStorage.setItem('gh_pat', t.trim());
    return t.trim();
  }
  return '';
}

function setStatus(msg, cls){
  statusEl.textContent = msg;
  statusEl.className = 'small ' + (cls || 'text-muted');
}
function setBtnRunning(on){
  isRunning = on;
  btn.disabled = on;
  btn.textContent = on ? '更新中...' : '更新数据';
}

// 查询仓库内状态文件(走 Pages CDN, 无 API 速率限制; cache-buster 保证拿到最新)
async function checkUpdateStatus(){
  try{
    const resp = await fetch('update_status.json?cb=' + Date.now());
    if(!resp.ok){ applyIdle(); return; }       // 文件不存在(首次) = 空闲
    const st = await resp.json();
    if(st.status === 'running' && st.started_at){
      const mins = (Date.now() - new Date(st.started_at).getTime()) / 60000;
      if(mins > STALE_MS / 60000){ applyIdle(); return; }   // 僵尸状态
      sawRunning = true;
      setBtnRunning(true);
      setStatus(`数据更新中(服务器已运行 ${Math.max(1, Math.round(mins))} 分钟), 完成后自动刷新, 请勿重复点击`, 'text-primary');
    }else{
      applyIdle(st.conclusion);
    }
  }catch(e){ /* 网络抖动保持现状, 下轮重试 */ }
}

function applyIdle(conclusion){
  const wasRunning = isRunning || sawRunning;
  sawRunning = false;
  setBtnRunning(false);
  if(wasRunning){
    // 刚从更新中变为空闲 → 自动拉取最新数据
    if(conclusion === 'failure' || conclusion === 'cancelled'){
      setStatus('本次更新失败, 可重试或查看 GitHub Actions 日志', 'text-danger');
    }else{
      setStatus('更新完成, 刷新数据...', 'text-success');
      loadData().then(() => setStatus('数据已更新 ✓', 'text-success'))
                .catch(() => setStatus('数据已更新, 请刷新页面', 'text-success'));
    }
  }
}

btn.addEventListener('click', async () => {
  if(isRunning) return;                        // 更新中: 按钮已禁用, 双保险
  let token = getToken();
  if(!token){
    token = askToken();
    if(!token) return;
  }
  setBtnRunning(true);
  setStatus('触发运行中...', 'text-muted');
  try{
    const resp = await fetch(`${API}/actions/workflows/${WF_FILE}/dispatches`, {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json'},
      body: JSON.stringify({ref: 'main'})
    });
    if(resp.status === 401){
      localStorage.removeItem('gh_pat');
      throw new Error('Token 无效, 已清除, 请重新点击按钮粘贴新 Token');
    }
    if(resp.status === 403){
      throw new Error('Token 无 Actions 写权限, 请检查 Token 权限设置');
    }
    if(resp.status !== 204){
      throw new Error('触发失败: HTTP ' + resp.status);
    }
    // 本地乐观锁定: 记录触发时间, 刷新页面后短时间内仍保持按钮禁用(等状态文件变为 running)
    localStorage.setItem('update_triggered_at', String(Date.now()));
    sawRunning = true;
    setStatus('已触发, 等待 GitHub 服务器开始运行(约 1-2 分钟后状态同步)...', 'text-primary');
  }catch(e){
    setStatus(e.message, 'text-danger');
    setBtnRunning(false);
  }
});

// 页面加载时: 若 5 分钟内刚触发过(可能刷新过页面), 先锁定按钮等状态文件同步
(function initRunningLock(){
  const t = Number(localStorage.getItem('update_triggered_at') || 0);
  if(t && Date.now() - t < 5 * 60 * 1000){
    setBtnRunning(true);
    sawRunning = true;
    setStatus('已触发更新, 等待服务器状态同步...', 'text-primary');
  }else if(t){
    localStorage.removeItem('update_triggered_at');
  }
})();

// 启动状态轮询: 每 20 秒一次, 所有访问者看到一致状态
checkUpdateStatus();
setInterval(checkUpdateStatus, 20000);
</script>
</body>
</html>

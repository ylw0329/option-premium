<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期权虚值权利金指标</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f5f5f5; }
.table-wrap { overflow-x: auto; background: #fff; border-radius: 8px; }
table { white-space: nowrap; font-size: 0.9rem; }
th { background: #e9ecef; position: sticky; top: 0; cursor: pointer; }
th:hover { background: #dee2e6; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.status-ok { color: #198754; font-weight: 600; }
.status-err { color: #dc3545; }
</style>
</head>
<body class="py-4">
<div class="container-fluid px-4">
  <h4 class="mb-1">期权虚值前两档权利金指标</h4>
  <p class="text-muted small mb-3">
    生成时间: <span id="genAt">加载中...</span>
    <span id="runDate" class="ms-3"></span>
  </p>

  <div class="d-flex gap-2 mb-3">
    <input id="search" class="form-control form-control-sm" style="max-width:280px"
           placeholder="搜索品种/交易所/月份...">
  </div>

  <div class="table-wrap">
    <table class="table table-sm table-hover mb-0">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <p class="text-muted small mt-3">
    公式: Result = (C虚1+C虚2+P虚1+P虚2) / [2×(到期天数)]　·
    到期天数 = TqSdk剩余天数 + 1　·
    IV 由 Black-Scholes 反解, 无风险利率 1.15%
  </p>
</div>

<script>
const NUM_COLS = ['标的价格','C虚1价格','C虚2价格','P虚1价格','P虚2价格',
  'C虚1IV','C虚2IV','P虚1IV','P虚2IV','到期天数','四张合约合计','合计÷2','最终结果'];
let DATA = [], COLS = [], sortCol = null, sortAsc = true;

// 数值列动态识别: 含"价格/IV/天数/合计/÷/结果"的列
function isNumCol(c){ return NUM_COLS.includes(c); }

function fmt(v, col){
  if(v === null || v === undefined || v === '') return '-';
  if(isNumCol(col)){
    const n = Number(v);
    if(!isNaN(n)) return n.toFixed(col.includes('IV') ? 4 : 2);
  }
  return String(v);
}

function renderHead(){
  const tr = document.createElement('tr');
  COLS.forEach(c => {
    const th = document.createElement('th');
    th.textContent = c;
    th.dataset.col = c;
    if(isNumCol(c)) th.classList.add('num');
    th.onclick = () => { if(sortCol===c){sortAsc=!sortAsc;} else {sortCol=c; sortAsc=true;} render(); };
    tr.appendChild(th);
  });
  document.getElementById('thead').innerHTML = '';
  document.getElementById('thead').appendChild(tr);
}

function renderBody(){
  const tb = document.getElementById('tbody');
  tb.innerHTML = '';
  const kw = document.getElementById('search').value.trim().toLowerCase();
  let rows = DATA.slice();
  if(kw){
    rows = rows.filter(r => COLS.some(c => String(r[c]??'').toLowerCase().includes(kw)));
  }
  if(sortCol){
    const nc = sortCol;
    rows.sort((a,b) => {
      let x = a[nc], y = b[nc];
      if(isNumCol(nc)){ x = Number(x)||0; y = Number(y)||0; }
      else { x = String(x??''); y = String(y??''); }
      if(x<y) return sortAsc?-1:1;
      if(x>y) return sortAsc?1:-1;
      return 0;
    });
  }
  rows.forEach(r => {
    const tr = document.createElement('tr');
    COLS.forEach(c => {
      const td = document.createElement('td');
      td.textContent = fmt(r[c], c);
      if(isNumCol(c)) td.classList.add('num');
      if(c === '状态'){
        const s = String(r[c]||'');
        td.classList.add(s==='OK'?'status-ok':'status-err');
      }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
}

function render(){
  renderHead();
  renderBody();
}

fetch('results.json')
  .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(j => {
    COLS = j.columns || [];
    DATA = j.data || [];
    document.getElementById('genAt').textContent = j.generated_at || '-';
    document.getElementById('runDate').textContent = j.run_date ? ('数据日期: '+j.runDate) : '';
    render();
  })
  .catch(e => {
    document.getElementById('genAt').textContent = '加载失败: ' + e.message;
  });

document.getElementById('search').addEventListener('input', renderBody);
</script>
</body>
</html>
